<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
</head>
<body>
    <h1>PDF Viewer</h1>
    
    <!-- Embed PDF using the <embed> tag -->
    <embed src="yourfile.pdf" width="100%" height="600px" type="application/pdf">
    
    <!-- Or use <iframe> as another option -->
    <!--
    <iframe src="yourfile.pdf" width="100%" height="600px">
        Your browser does not support PDF viewing. Download the PDF to view it: <a href="yourfile.pdf">Download PDF</a>
    </iframe>
    -->
</body>
</html>
