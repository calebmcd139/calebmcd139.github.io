<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Website with Images, PDF Viewer, and Email Icon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        #header-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
        }
        #center-image, #footer-image {
            width: 50%;
            margin: 20px auto;
        }
        #pdf-viewer-container {
            width: 80%;
            margin: 20px auto;
            position: relative;
        }
        #pdf-viewer {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
        }
        #pdf-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }
        .button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #45a049;
        }
        #email-icon {
            width: 50px;
            height: 50px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Header Image -->
    <img id="header-image" src="header-image.jpg" alt="Header Image">

    <!-- Second Image -->
    <img id="center-image" src="center-image.jpg" alt="Center Image">

    <!-- PDF Viewer with Controls -->
    <div id="pdf-viewer-container">
        <embed id="pdf-viewer" src="sample.pdf" type="application/pdf">
        <div id="pdf-controls">
            <button class="button" onclick="prevPage()">&#8592; Prev</button>
            <button class="button" onclick="nextPage()">Next &#8594;</button>
        </div>
    </div>

    <!-- Third Image -->
    <img id="footer-image" src="footer-image.jpg" alt="Footer Image">

    <!-- Email Icon -->
    <a href="https://www.google.com" target="_blank">
        <img id="email-icon" src="email-icon.png" alt="Email Icon">
    </a>

    <!-- JavaScript for PDF Viewer -->
    <script>
        var currentPage = 1;
        var totalPages = 0;

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                loadPDF();
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadPDF();
            }
        }

        function loadPDF() {
            var pdfUrl = "sample.pdf";
            var viewer = document.getElementById('pdf-viewer');
            viewer.src = pdfUrl + "#page=" + currentPage;
        }
        
        // Initialize PDF page loading
        window.onload = loadPDF;
    </script>

</body>
</html>
