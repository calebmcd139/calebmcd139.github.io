<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Stole Baby Jesus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        #header-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
        }
        #center-image, #footer-image {
            width: 50%;
            margin: 20px auto;
        }
        #pdf-viewer-container {
            width: 80%;
            margin: 20px auto;
            position: relative;
        }
        #pdf-canvas {
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
        }
        #pdf-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }
        .button {
            background-color: transparent;
            border: none;
            cursor: pointer;
        }
        .button img {
            width: 50px; /* Set the size of the icons */
            height: 50px;
        }
        #email-icon {
    width: 50px;
    height: 50px;
    cursor: pointer;
    margin: 20px auto 0; /* Center the icon and add spacing */
    display: block; /* Ensure it's a block-level element */
        }
        }
    </style>
</head>
<body>

    <!-- Header Image -->
    <img id="header-image" src="headerimage.jpg" alt="Header Image">

    <!-- Second Image -->
    <img id="center-image" src="centerimage2.jpg" alt="Center Image">

    <!-- PDF Viewer with Controls -->
    <div id="pdf-viewer-container">
        <canvas id="pdf-canvas"></canvas>
        <div id="pdf-controls">
            <button class="button" onclick="prevPage()">
                <img src="prev-icon.png" alt="Previous">
            </button>
            <button class="button" onclick="nextPage()">
                <img src="next-icon.png" alt="Next">
            </button>
        </div>
    </div>

    <!-- Third Image -->
    <img id="footer-image" src="footerimage.jpg" alt="Footer Image">

    <!-- Email Icon -->
    <a href="mailto:whostolebabyjesus@gmail.com" target="_blank">
    <img id="email-icon" src="emailicon.png" alt="Email Icon">
    </a>

    <!-- Copyright Disclaimer -->
    <footer style="text-align: center; padding: 20px 0; font-size: 14px; color: #555;">
    <p>&copy; 2025 Caleb McDonald. All rights reserved.</p>
    </footer>

    <!-- PDF.js Script (from CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>

    <script>
        var pdfDoc = null;
        var currentPage = 1;
        var totalPages = 0;
        var canvas = document.getElementById('pdf-canvas');
        var ctx = canvas.getContext('2d');

        // Load PDF document
        pdfjsLib.getDocument('pdfs/Who-Stole-Baby-Jesus-Episode-One-Screenplay.pdf').promise.then(function(pdf) { // Updated file name and path
            pdfDoc = pdf;
            totalPages = pdf.numPages;
            renderPage(currentPage);
        });

        // Render a page
        function renderPage(pageNum) {
            pdfDoc.getPage(pageNum).then(function(page) {
                var viewport = page.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                var renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                page.render(renderContext);
            });
        }

        // Go to the next page
        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        }

        // Go to the previous page
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        }
    </script>

</body>
</html>
